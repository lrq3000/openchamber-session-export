<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Session Export</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:18px;background:var(--oc-bg);color:var(--oc-fg);font:13px/1.55 var(--oc-font,system-ui)}h1{font-size:1.4rem;line-height:1.25;margin:0 0 6px;font-weight:600}h2{font-size:1rem;font-weight:600;margin:16px 0 8px}p{margin:8px 0 14px}.muted{color:var(--oc-muted)}.small{font-size:.88rem}.target{margin:20px 0 12px;display:grid;gap:5px}.target strong{font-size:1.05rem}code{display:block;white-space:pre-wrap;overflow-wrap:anywhere;font: .85rem/1.5 var(--oc-mono,monospace);color:var(--oc-muted)}.note{background:var(--oc-subtle);padding:10px 12px;border-radius:var(--oc-radius,6px);font-size:.92rem}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.asset{padding:10px 0;border-bottom:1px solid var(--oc-border);overflow-wrap:anywhere}#inventory{margin-top:18px;padding-top:6px;border-top:1px solid var(--oc-border)}#status{color:var(--oc-success-text);overflow-wrap:anywhere}#error{color:var(--oc-error-text);overflow-wrap:anywhere}.warning{white-space:pre-wrap;color:var(--oc-warning-text)}footer{margin-top:24px}#output-directory{margin-top:16px}[hidden]{display:none!important}
  </style>
  <style>
    .target strong,.warning{overflow-wrap:anywhere}.target,main{min-width:0}#import-panel{margin-top:24px;border-top:1px solid var(--oc-border);padding-top:8px}#import-preview{white-space:pre-wrap;overflow-wrap:anywhere}#import-notice{font-style:italic}#import-error{color:var(--oc-error-text)}#import-file{max-width:100%;display:block;margin:8px 0}
    /* Override only sizing at touch/phone widths; preserve the SDK's theme, keyboard behavior and desktop presentation. */
    @media(max-width:480px),(pointer:coarse){body{padding:14px}#app .oc-sdk-btn{height:auto;min-height:44px;white-space:normal;line-height:1.3}#app .oc-sdk-check{min-height:44px;padding:10px 0}#app .oc-sdk-input{min-height:44px;font-size:max(1rem,16px)}}
  </style>
</head>
<body><main id="app"></main><script src="app.js"></script></body>
</html>
